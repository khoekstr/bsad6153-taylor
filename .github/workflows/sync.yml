name: Library sync

on:
  schedule:
    # 08:00 and 14:00 America/Chicago (CST), November 13-16 only.
    # schedule_window.py restricts the year to 2026; no annual sync restart.
    - cron: '0 14,20 13-16 11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (audit row retained; no library additions)'
        required: true
        type: boolean
        default: false
  push:
    branches: [milestone-3-sync]

permissions:
  contents: read

concurrency:
  group: library-sync
  cancel-in-progress: false

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_sync: ${{ steps.window.outputs.run_sync }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: window
        run: python3 scripts/schedule_window.py

  validate:
    needs: window
    if: github.event_name == 'push' || needs.window.outputs.run_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - run: python -m pip install -r requirements-sync.txt
      - name: Offline tests (no credentials)
        run: python -m unittest ingest.test_fetch ingest.test_sync ingest.test_connections scripts.test_schedule_window -v

  sync:
    needs: [window, validate]
    if: needs.window.outputs.run_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - run: python -m pip install -r requirements-sync.txt
      - name: Discover and save new papers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          trigger=manual
          if [[ "$SYNC_EVENT" == "schedule" ]]; then trigger=schedule; fi
          args=(--trigger "$trigger")
          if [[ "$SYNC_EVENT" == "workflow_dispatch" && "$SYNC_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python ingest/sync.py "${args[@]}"
